<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>NutriDia — Login</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #FBFDF8;
            font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background: #101410; }
        }
        canvas { outline: none; }
        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #717971;
        }
    </style>
</head>
<body>
    <div id="loader">Carregando NutriDia…</div>
    <canvas id="composeCanvas"></canvas>
    <script src="nutridia.js"></script>
    <script>
        // Remove o texto de carregamento assim que o Compose desenha o primeiro frame.
        const obs = new MutationObserver(() => {
            const loader = document.getElementById('loader');
            if (loader && document.getElementById('composeCanvas').width > 0) {
                loader.remove();
                obs.disconnect();
            }
        });
        obs.observe(document.getElementById('composeCanvas'), { attributes: true });
    </script>
</body>
</html>
